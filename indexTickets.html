<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>SGRSI</h1>
    <p>Sistema de Gestión de Recursos y Soporte Informático</p>
</header>

<nav>
    <a href="index.html">Inicio</a>
    <a href="indexRecursos.html">Inventario</a>
    <a href="indexUsuarios.html">Usuarios</a>
    <a href="indexPrestamos.html">Préstamos</a>

    <a href="indexReportes.html">Reportes</a>
    <a href="indexHistorial.html">Historial</a>
</nav>

<main>
    <section id="tickets">
        <h2>Mesa de Ayuda – Tickets</h2>

        <form id="formTicket">
            <label for="solicitanteTicket">Solicitante</label>
            <input type="text" id="solicitanteTicket" placeholder="Ej: Prof. López" required>

            <label for="prioridadTicket">Prioridad</label>
            <select id="prioridadTicket" required>
                <option value="">Seleccionar…</option>
                <option value="Alta">Alta</option>
                <option value="Media">Media</option>
                <option value="Baja">Baja</option>
            </select>

            <label for="problemaTicket">Descripción del problema</label>
            <textarea id="problemaTicket" placeholder="Describí el problema con detalle…" required></textarea>

            <button type="submit" id="botonCrearTicket">Crear Ticket</button>
        </form>

        <p id="mensajeTicket" class="mensaje"></p>

        <div class="tabla-wrapper" id="contenedorTablaTickets"></div>
    </section>
</main>

<footer>
    <p>© SGRSI – Proyecto Bachillerato Tecnológico</p>
</footer>

<script src="tickets.js"></script>
</body>
</html>
