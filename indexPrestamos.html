<main>
    <section id="prestamos">
        <h2>Registro de Préstamos</h2>

        <form id="formPrestamo">
            <label for="nombreSolicitante">Nombre del solicitante</label>
            <input type="text" id="nombreSolicitante" placeholder="Ej: Juan Pérez" required>

            <label for="fechaDevolucion">Fecha estimada de devolución</label>
            <input type="date" id="fechaDevolucion">

            <label for="equipoPrestamo">Equipo</label>
            <select id="equipoPrestamo" required>
                <option value="">Seleccionar equipo…</option>
            </select>

            <button type="button" id="botonRegistrarPrestamo">Registrar Préstamo</button>
        </form>

        <p id="mensajePrestamo" class="mensaje"></p>

        <div class="tabla-wrapper" id="contenedorTablaPrestamos"></div>
    </section>
</main>

<footer>
    <p>© SGRSI – Proyecto Bachillerato Tecnológico</p>
</footer>

<script src="auth.js"></script>
<script src="prestamos.js"></script>
</body>
