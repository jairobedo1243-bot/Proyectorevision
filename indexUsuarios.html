<header>
    <h1>SGRSI</h1>
    <p>Sistema de Gestión de Recursos y Soporte Informático</p>
</header>

<nav>
    <a href="index.html">Inicio</a>

<main>
    <section id="altaUsuarios">
        <h2>Alta de Usuarios</h2>

        <form id="formUsuario">
            <label for="nombreUsuario">Nombre completo</label>
            <input type="text" id="nombreUsuario" placeholder="Ej: María González" required>

            <label for="correoUsuario">Correo electrónico</label>
            <input type="email" id="correoUsuario" placeholder="usuario@institucion.edu" required>

            <label for="rolUsuario">Rol</label>
            <select id="rolUsuario" required>
                <option value="">Seleccionar rol…</option>
                <option value="Docente">Docente</option>
                <option value="Técnico">Técnico</option>
                <option value="Administrador">Administrador</option>
            </select>

            <button type="button" id="botonAgregarUsuario">Agregar Usuario</button>
        </form>

        <p id="mensajeUsuario" class="mensaje"></p>

        <div class="tabla-wrapper" id="contenedorTablaUsuarios"></div>
    </section>
</main>

<footer>
    <p>© SGRSI – Proyecto Bachillerato Tecnológico</p>
</footer>

<script src="usuarios.js"></script>
</body>
</html>
